<!--
  Conduct Interview page — the main interview interface. The interviewer can speak to
  the AI persona in text mode (keyboard) or voice mode (microphone hold-to-talk).

  Key design decisions:
  - The backend is stateless: the full chatHistory array is sent with every /api/chat
    request; the server holds no conversation state between calls.
  - In voice mode the response from /api/chat is a WAV audio blob in the HTTP response
    body. The transcript text is returned separately, Base64-encoded in the custom
    response header "X-Reply-Text-Base64". This avoids multipart responses.
  - TTS audio is queued through _ttsQueue/_ttsPlaying to prevent clips overlapping.
  - Persona data is read from localStorage on every request in case it was updated.
-->

<script>
  // chatHistory is the full conversation sent to the backend on every request.
  // The backend is stateless, so the entire history must be included each time.
  let chatHistory = [];

  // A single persistent <audio> element is reused for all TTS playback.
  // Audio responses are queued so they play sequentially rather than overlapping.
  let _ttsPlayer = null;
  let _ttsQueue = [];
  let _ttsPlaying = false;

  // Alternative Web Audio API playback path. Disabled by default because the standard
  // HTMLAudio element is more widely compatible. Can be enabled at runtime via the
  // browser console (USE_WEBAUDIO = true) for debugging audio issues.
  let USE_WEBAUDIO = false;
  let _waQueue = [];
  let _waPlaying = false;
  let _waGain = 1.2; // slight volume boost for voices that are quiet at 1.0

  // Holds the active microphone MediaStream between recordings so we can stop all tracks
  // when recording ends. Browsers keep the microphone-in-use indicator lit for as long
  // as any track from the stream remains active, so releasing it promptly is important.
let micStream = null;

  function ensureAudioContext() {
    if (!_audioCtx) {
      try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { _audioCtx = null; }
    }
    return _audioCtx;
  }

  async function _waPlayNext() {
    if (_waPlaying || _waQueue.length === 0) return;
    const ctx = ensureAudioContext();
    if (!ctx) { console.warn("[Audio][WA] No AudioContext; falling back to <audio>."); return; }

    try {
      await ctx.resume();
    } catch (_) {}
    console.log("[Audio][WA] context state:", ctx && ctx.state);

    const blob = _waQueue.shift();
    _waPlaying = true;

    try {
      const ab = await blob.arrayBuffer();
      const buffer = await ctx.decodeAudioData(ab.slice(0));

      // Piper TTS voices are compiled at different native sample rates (16k, 22k, 24k, 32k Hz).
      // If the audio buffer's sample rate differs from the AudioContext output rate, the browser
      // will play it at the wrong pitch and speed. We resample offline to correct this.
      let outBuffer = buffer;
      if (buffer.sampleRate !== ctx.sampleRate) {
        try {
          const ratio = ctx.sampleRate / buffer.sampleRate;
          const targetLength = Math.ceil(buffer.length * ratio);
          const offline = new OfflineAudioContext(
            buffer.numberOfChannels,
            targetLength,
            ctx.sampleRate
          );
          const offSrc = offline.createBufferSource();
          offSrc.buffer = buffer;
          offSrc.connect(offline.destination);
          offSrc.start(0);
          outBuffer = await offline.startRendering();
          console.log(`[Audio][WA] resampled from ${buffer.sampleRate} to ${ctx.sampleRate} Hz`);
        } catch (re) {
          console.warn("[Audio][WA] resample failed; using original buffer", re);
          outBuffer = buffer;
        }
      }

      const src = ctx.createBufferSource();
      src.buffer = outBuffer;
      const gain = ctx.createGain();
      gain.gain.value = _waGain; // runtime adjustable
      src.connect(gain).connect(ctx.destination);
      src.onended = () => {
        _waPlaying = false;
        _waPlayNext();
      };
      console.log("[Audio][WA] play buffer:", { duration: outBuffer.duration.toFixed(3), sr: outBuffer.sampleRate, ch: outBuffer.numberOfChannels });
      src.start();
    } catch (e) {
      console.warn("[Audio][WA] decode/play failed; enqueueing via <audio> fallback.", e);
      // Fallback to <audio> queue if WebAudio decode fails
      const url = URL.createObjectURL(blob);
      _ttsQueue.push(url);
      if (!_ttsPlaying) playNextInQueue();
      _waPlaying = false;
    }
  }

  function ensureTtsPlayer() {
    if (_ttsPlayer) return _ttsPlayer;
    const a = new Audio();
    a.muted = false;
    a.volume = 1.0;
    a.preload = "auto";
    a.addEventListener("play",   () => console.log("[Audio] player: play"));
    a.addEventListener("ended",  () => { console.log("[Audio] player: ended"); _ttsPlaying = false; playNextInQueue(); });
    a.addEventListener("error",  (e) => { console.warn("[Audio] player: error", e); _ttsPlaying = false; playNextInQueue(); });
    a.addEventListener("stalled",() => console.log("[Audio] player: stalled"));
    a.addEventListener("suspend",() => console.log("[Audio] player: suspend"));
    a.addEventListener("waiting",() => console.log("[Audio] player: waiting"));
    _ttsPlayer = a;
    return a;
  }

  function enqueueBlob(blob) {
    window.__lastAudioBlob = blob; // retained for debugging in the browser console
    try { console.log("[Audio] enqueueBlob size:", blob && blob.size); } catch {}
    if (USE_WEBAUDIO) {
      _waQueue.push(blob);
      _waPlayNext();
      return;
    }
    const url = URL.createObjectURL(blob);
    _ttsQueue.push(url);
    if (!_ttsPlaying) playNextInQueue();
  }

  function enqueueDataUri(dataUri) {
    // Convert the data URI to a Blob so it can go through the same queue as other audio
    // sources. Object URLs created from Blobs can be revoked after playback, which
    // prevents memory leaks that would accumulate over a long interview session.
    fetch(dataUri).then(r => r.blob()).then(enqueueBlob).catch(err => {
      console.warn("[Audio] enqueueDataUri failed:", err);
    });
  }

  function playNextInQueue() {
    if (_ttsQueue.length === 0) return;
    const player = ensureTtsPlayer();
    const url = _ttsQueue.shift();
    _ttsPlaying = true;

    // Revoke URL when done
    player.addEventListener("ended", () => URL.revokeObjectURL(url), { once: true });

    player.src = url;
    player.play().catch(err => {
      console.warn("[Audio] play() blocked; waiting for a user gesture…", err);
      const oneShot = () => {
        player.play().catch(console.error);
        window.removeEventListener("click", oneShot);
        window.removeEventListener("keydown", oneShot);
      };
      window.addEventListener("click", oneShot, { once: true });
      window.addEventListener("keydown", oneShot, { once: true });
    });
  }

  // Browsers block audio playback until the user has interacted with the page.
  // Creating and immediately resuming an AudioContext on the first click or keypress
  // satisfies this requirement and allows all subsequent TTS playback to proceed
  // without individual play() calls being blocked.
  let _audioCtx = null;
  function unlockAudioOnGesture() {
    try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
    const resume = () => {
      if (_audioCtx) _audioCtx.resume().catch(() => {});
      window.removeEventListener("click", resume);
      window.removeEventListener("keydown", resume);
    };
    window.addEventListener("click", resume, { once: true });
    window.addEventListener("keydown", resume, { once: true });
  }
  document.addEventListener("DOMContentLoaded", unlockAudioOnGesture);

  // When the user plugs in or removes an audio device mid-interview, the shared player
  // can produce static on the first clip played through the new device. Discarding
  // and recreating the player object clears any stale internal state.
try {
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
    navigator.mediaDevices.addEventListener('devicechange', () => {
      console.log('[Audio] devicechange detected — rebuilding shared player');
      try { if (_ttsPlayer) { _ttsPlayer.pause(); _ttsPlayer.src = ''; } } catch(_){}
      _ttsPlayer = null;
      ensureTtsPlayer();
    });
  }
} catch (e) {
  console.warn('[Audio] devicechange hookup failed', e);
}

  // Returns the voice model filename and speaker ID from the persona stored in localStorage.
  // Several field name variants are tried because the persona schema has evolved over
  // multiple releases. The standard path (top-level persona_voice_model) is tried first.
  function getPersonaVoiceSelection() {
    let persona = {};
    try {
      persona = JSON.parse(localStorage.getItem("persona_data") || "{}");
    } catch (e) {
      console.warn("[TTS] Could not parse persona_data from localStorage.", e);
      persona = {};
    }

    // Older persona files may nest voice settings under persona.voice or persona.persona_voice.
    const v = (persona && (persona.voice || persona.persona_voice)) ? (persona.voice || persona.persona_voice) : {};

    try { console.log("[TTS] persona top-level keys:", Object.keys(persona || {})); } catch {}
    try { console.log("[TTS] persona.voice keys:", Object.keys(v || {})); } catch {}

    // Current persona format: voice fields are stored at the top level of the JSON.
    // Cache the resolved values in localStorage so repeated calls avoid re-parsing.
    if (typeof persona.persona_voice_model === "string" && persona.persona_voice_model.trim()) {
      const vf = persona.persona_voice_model.trim();
      let sid = null;
      if (persona.persona_voice_speaker_id !== undefined && persona.persona_voice_speaker_id !== null) {
        sid = Number.isInteger(persona.persona_voice_speaker_id)
          ? persona.persona_voice_speaker_id
          : (isFinite(parseInt(persona.persona_voice_speaker_id)) ? parseInt(persona.persona_voice_speaker_id) : null);
      }
      // Persist for subsequent calls / pages so we don't depend on timing
      localStorage.setItem("last_voice_file", vf);
      if (sid !== null && sid !== undefined) localStorage.setItem("last_speaker_id", String(sid));
      clearVoiceError();
      console.log("[TTS] Using top-level persona_voice_model:", vf, "speakerId:", sid);
      return { voiceFile: vf, speakerId: sid };
    }

    // Legacy fallback: older persona files nested voice data under persona.voice or
    // used different field names. Try each known variant before giving up.
    const candidate = [
      typeof v.onnx_filename === "string" ? v.onnx_filename.trim() : "",
      typeof v["onnx-filename"] === "string" ? v["onnx-filename"].trim() : "",
      typeof v.voice_file === "string" ? v.voice_file.trim() : "",
      typeof persona.persona_voice_model === "string" ? persona.persona_voice_model.trim() : "",
      typeof persona.persona_voice_file === "string" ? persona.persona_voice_file.trim() : "",
      typeof persona.voice_file === "string" ? persona.voice_file.trim() : ""
    ].find(Boolean);

    const voiceFile = candidate || null;

    // Speaker ID can be number or numeric string.
    // Check nested voice first, then common top-level fields, then localStorage.
    let speakerId = null;
    if (v && v.speaker_id !== undefined && v.speaker_id !== null) {
      speakerId = Number.isInteger(v.speaker_id) ? v.speaker_id : (isFinite(parseInt(v.speaker_id)) ? parseInt(v.speaker_id) : null);
    } else if (persona && persona.speaker_id !== undefined && persona.speaker_id !== null) {
      speakerId = Number.isInteger(persona.speaker_id) ? persona.speaker_id : (isFinite(parseInt(persona.speaker_id)) ? parseInt(persona.speaker_id) : null);
    } else if (persona && persona.persona_voice_speaker_id !== undefined && persona.persona_voice_speaker_id !== null) {
      speakerId = Number.isInteger(persona.persona_voice_speaker_id)
        ? persona.persona_voice_speaker_id
        : (isFinite(parseInt(persona.persona_voice_speaker_id)) ? parseInt(persona.persona_voice_speaker_id) : null);
    } else {
      const lsSid = localStorage.getItem("last_speaker_id");
      speakerId = (lsSid !== null && lsSid !== undefined && isFinite(parseInt(lsSid))) ? parseInt(lsSid) : null;
    }

    if (!voiceFile) {
      try {
        console.log("[TTS] Diagnostic — considered fields:", {
          v_onxx_filename: v && v.onnx_filename,
          v_onnx_kebab: v && v["onnx-filename"],
          v_voice_file: v && v.voice_file,
          top_persona_voice_model: persona && persona.persona_voice_model,
          top_persona_voice_file: persona && persona.persona_voice_file,
          top_voice_file: persona && persona.voice_file
        });
      } catch {}
      showVoiceError("🔴 No persona voice is configured for this profile. Go to the main page → Edit Profile, choose a voice, then export a new persona file and load it here.");
      console.warn("[TTS] No persona voice configured. Instruct user: Main page → Edit Profile → choose a voice → export updated persona → reload.");
      return null;
    }

    clearVoiceError();
    console.log("[TTS] Using persona voice file:", voiceFile, "speakerId:", speakerId);
    return { voiceFile, speakerId };
  }

  async function speakAnswerViaPlayVoice(answerText) {
    let sel = getPersonaVoiceSelection();
    if (!sel) {
      // No voice is configured in the persona. Rather than silently failing,
      // try to use the first available voice from the server so the interview
      // can at least function in audio mode with a generic voice.
      try {
        const resp = await fetch("/api/piper-voices");
        if (resp.ok) {
          const list = await resp.json();
          if (Array.isArray(list) && list.length > 0) {
            const vf = (list[0] && (list[0]["onnx-filename"] || list[0]["onnx_filename"])) || null;
            const sid = (list[0] && (Number.isInteger(list[0]["speaker_id"]) ? list[0]["speaker_id"] : null));
            if (vf) {
              // Persist for next time
              localStorage.setItem("last_voice_file", vf);
              if (sid !== null && sid !== undefined) localStorage.setItem("last_speaker_id", String(sid));
              sel = { voiceFile: vf, speakerId: sid ?? null };
              showVoiceError(""); // clear any previous warning
              console.log("[TTS] Using default voice from /api/piper-voices:", sel);
            }
          }
        }
      } catch (e) {
        console.warn("Could not fetch /api/piper-voices for default voice:", e);
      }
    }
    if (!sel) {
      console.warn("No persona voice available even after trying /api/piper-voices; skipping TTS.");
      return;
    }
    const { voiceFile, speakerId } = sel;
    console.log("[TTS] /api/play-voice payload:", { text: (answerText || "").slice(0, 80), voice_file: voiceFile, speaker_id: speakerId });
    const res = await fetch("/api/play-voice", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text: answerText,
        voice_file: voiceFile,
        speaker_id: speakerId
      })
    });
    if (!res.ok) {
      const errText = await res.text().catch(() => "");
      throw new Error(`TTS failed (${res.status}): ${errText}`);
    }
    const blob = await res.blob();
    enqueueBlob(blob);
  }

  async function playFromUrl(url) {
    console.log("[Audio] fetching URL:", url);
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Audio URL fetch failed (${res.status})`);
    const ct = (res.headers.get('content-type') || '').toLowerCase();
    if (!ct.startsWith('audio/')) throw new Error(`URL did not return audio (content-type: ${ct})`);
    const blob = await res.blob();
    if (!blob || blob.size < 44) throw new Error('Audio blob too small.');
    enqueueBlob(blob);
  }
  
  async function playFromDataUri(dataUri) {
    enqueueDataUri(dataUri);
  }
  
  // Cleans up common text encoding issues in LLM output before displaying or speaking it.
  // Two types of corruption are fixed:
  //   1. Mojibake — UTF-8 bytes that were incorrectly decoded as Windows-1252, producing
  //      multi-character garbage sequences (e.g., â€™ instead of an apostrophe).
  //   2. Unicode punctuation — curly quotes, em-dashes, and ellipsis characters that some
  //      LLMs emit but that cause problems in TTS and Word export.
  function normalizeSmartQuotes(s) {
    if (typeof s !== 'string') return s;
    let out = s;

    // Step 1: Fix UTF-8 bytes that were decoded as Windows-1252 (common when LLM output
    // travels through certain streaming parsers). These appear as multi-character garbage.
    out = out.replace(/â€™/g, "'")
             .replace(/â€˜/g, "'")
             .replace(/â€œ|â€/g, '"');
    // Step 2 prep: dashes and ellipsis mojibake sequences.
    out = out.replace(/â€“/g, '-')
             .replace(/â€”/g, '--')
             .replace(/â€¦/g, '...');
    out = out.replace(/Â /g, ' ');

    // Step 2: Replace genuine Unicode punctuation with plain ASCII equivalents.
    out = out
      .replace(/[\u2018\u2019\u2032]/g, "'")
      .replace(/[\u201C\u201D\u2033]/g, '"')
      .replace(/[\u2014]/g, '--')
      .replace(/[\u2013]/g, '-')
      .replace(/[\u2026]/g, '...')
      .replace(/[\u00A0]/g, ' ');

    // Step 3: The Unicode replacement character (U+FFFD) sometimes appears in place of
    // an apostrophe that was lost during encoding. Infer from context whether it should
    // be restored as an apostrophe, then replace any remaining instances with one.
    out = out.replace(/([A-Za-z0-9])\uFFFD([A-Za-z0-9])/g, "$1'$2");
    out = out.replace(/\b\uFFFD([A-Za-z])/g, "'$1");
    out = out.replace(/([A-Za-z])\uFFFD\b/g, "$1'");
    // Any remaining isolated replacement characters — use apostrophe as the safest fallback.
    out = out.replace(/\uFFFD/g, "'");

    return out;
  }

  // Extract assistant reply text from heterogeneous JSON shapes
  function extractReplyText(payload) {
    if (!payload || typeof payload !== 'object') return '';
    const candidates = [
      payload.response, payload.reply, payload.text, payload.answer, payload.assistant, payload.message, payload.output,
      payload.choices && payload.choices[0] && payload.choices[0].message && payload.choices[0].message.content,
      payload.choices && payload.choices[0] && payload.choices[0].text,
      payload.data && payload.data.response,
      payload.data && payload.data.reply,
      payload.data && payload.data.text,
      payload.data && payload.data.answer,
      payload.data && payload.data.message,
      payload.result && payload.result.response,
      payload.result && payload.result.reply,
      payload.result && payload.result.text,
      payload.result && payload.result.answer,
    ].filter(Boolean);
    if (candidates.length > 0) return String(candidates[0]).trim();
    try {
      const s = JSON.stringify(payload);
      const m = s.match(/"content"\s*:\s*"([^"]{1,500})"/);
      return m ? m[1] : '';
    } catch { return ''; }
  }

  async function playAudioFromSources({ streamUrl, fileUrl, b64, aiReply }) {
    console.log("[Audio] sources:", { streamUrl, fileUrl, hasB64: !!b64, hasReply: !!aiReply });
    // Diagnostic override: append ?force_tts=1 to the page URL to bypass the normal
    // audio sources (stream, file, Base64) and go straight to the TTS fallback.
    // Useful when testing the Piper voice path in isolation.
    const force = new URLSearchParams(location.search).get('force_tts') === '1';
    if (force) {
      console.log("[Audio] force_tts=1 present — using /api/play-voice fallback immediately.");
      if (aiReply) {
        await speakAnswerViaPlayVoice(aiReply);
      } else {
        console.log("[Audio] No aiReply text available to send to TTS.");
      }
      return true;
    }
    try {
      if (streamUrl) {
        await playFromUrl(streamUrl);
        return true;
      }
      if (fileUrl) {
        await playFromUrl(fileUrl);
        return true;
      }
      if (b64) {
        const dataUri = `data:audio/wav;base64,${b64}`;

<script>
  const statusBox = document.getElementById("systemStatus");
  const subtext = document.getElementById("status-subtext");
  const startBtn = document.querySelector(".segmented-start-button");
  startBtn.disabled = true;

  function setStatusReady() {
    statusBox.classList.remove("fade-pulse", "system-error", "system-ready");
    statusBox.textContent = "The A.I. persona is ready. You may begin the interview.";
    statusBox.classList.add("system-ready");
    startBtn.disabled = false;
    if (subtext) subtext.textContent = "";
    localStorage.setItem("llm_ready", "true");
  }

  function setStatusError() {
    statusBox.classList.remove("fade-pulse", "system-ready");
    statusBox.textContent = "⚠️ System check failed. You may experience delays.";
    statusBox.classList.add("system-error");
    startBtn.disabled = false;
    if (subtext) subtext.textContent = "";
  }

  function pollUntilReady(retries = 15) {
    // Poll /backend/system-warmup to check if the LLM is ready. The warm-up itself
  // is triggered manually (via the admin page or a separate POST), never from here,
  // to avoid slowing application startup.
    if (localStorage.getItem("llm_ready") === "true") {
      setStatusReady();
      return;
    }
    fetch("/backend/system-warmup")
      .then(response => {
        if (!response.ok) throw new Error("Non-OK response");
        return response.json();
      })
      .then(data => {
        setStatusReady();
      })
      .catch(() => {
        if (retries > 0) {
          setTimeout(() => pollUntilReady(retries - 1), 2000);
        } else {
          setStatusError();
        }
      });
  }

  function pollSystemStatus() {
    statusBox.textContent = "Preparing A.I. persona…";
    if (subtext) subtext.textContent = "This may take up to 30 seconds the first time you use the system.";

    // Warm-up is triggered separately; here we only check if it is done.
    if (localStorage.getItem("llm_ready") === "true") {
      setStatusReady();
    } else {
      pollUntilReady();
    }
  }

  document.addEventListener("DOMContentLoaded", pollSystemStatus);
</script>

      replyPara.style.marginLeft = "20px";
      {
        const tag = (personaData.persona_type || "").toLowerCase() === "suspect" ? "[SUSPECT]" : "[WITNESS]";
        replyPara.dataset.export = `${tag} ${aiReplyNorm}`;
      }
      transcriptArea.appendChild(replyPara);

      // Text mode: intentionally no TTS — audio is only played in voice mode.

    } catch (err) {
      transcriptArea.innerHTML += `<p>⚠️ ERROR: ${err.message}</p>`;
    }

    if (thinkingMsg) thinkingMsg.style.display = "none";
    scrollTranscriptToBottom();
  }

  inputField.addEventListener("keydown", async function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      await submitTextMessage();
    }
  });

  const sendBtn = document.getElementById("sendBtn");
  if (sendBtn) {
    sendBtn.addEventListener("click", async function () {
      await submitTextMessage();
      inputField.focus();
    });
  }
});
</script>
<script>
// Legacy helper — creates the "Transcript" heading inside #transcript if it does not
// already exist. This div is not currently used by the main interview flow (which
// renders into #transcriptArea instead), but is kept to avoid breaking any future
// callers of appendToTranscript().
function ensureTranscriptHeader() {
  const transcriptDiv = document.getElementById("transcript");
  if (!document.getElementById("transcript-header")) {
    const header = document.createElement("h3");
    header.textContent = "Transcript";
    header.id = "transcript-header";
    header.style.marginTop = "30px";
    transcriptDiv.appendChild(header);
  }
}

// Legacy helper — appends a question/answer pair to the old #transcript div.
// Not called by the current interview flow; kept for compatibility.
function appendToTranscript(questionText, answerText) {
  ensureTranscriptHeader();

  const transcriptDiv = document.getElementById("transcript");

  const qaContainer = document.createElement("div");
  qaContainer.className = "qa-pair";

  const questionElem = document.createElement("div");
  questionElem.className = "question";
  questionElem.textContent = questionText;

  const answerElem = document.createElement("div");
  answerElem.className = "answer";
  answerElem.textContent = answerText;

  qaContainer.appendChild(questionElem);
  qaContainer.appendChild(answerElem);
  transcriptDiv.appendChild(qaContainer);

  // Scroll to bottom to show latest entry
  transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
}
</script>
</div>
</body>
